:root {
  --felt-centre: #17324f;
  --felt-edge: #0b1a2e;
  --rail: #060f1c;
  --brass: #a58a4e;
  --brass-bright: #c9a75c;
  --text: #f3ecdc;
  --text-muted: #b9c2cc;
  --plate: #0a1626;
  --plate-detail: #aab4c0;
  --turn: #dcb864;
  --turn-ink: #14202f;
  --panel: #0e1f36;
  --panel-detail: #b2bbc6;
  --secondary: #f3ecdc;
  --secondary-ink: #14202f;
  --secondary-lip: #a89f8c;
  --primary: #dcb864;
  --primary-ink: #14202f;
  --primary-lip: #8f7434;
  --input: #0a1626;
  --error: #ffb3a8;
  --success: #8fd6a4;
  --focus: #ffe69a;
  --focus-halo: #0a1626;
  --win-glow: #ffd76a;
  --ink: #1b2533;
  --dim: rgb(11 26 46 / 50%);
  --scrim: rgb(6 15 28 / 72%);
  --shadow: 0 10px 30px rgb(0 0 0 / 35%);

  --trump-tint: #fff09a;
  --trump-edge: #b58a00;
  --trump-ink: #493700;

  --radius-panel: 20px;
  --radius-plate: 15px;
  --radius-input: 12px;
  --radius-bubble: 14px;
  --radius-bid: 13px;
  --radius-pill: 999px;
  --lip: 3px;
  --rail-width: 10px;

  --space-1: .25rem;
  --space-2: .5rem;
  --space-3: .75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --result-clearance: 17rem;

  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --text-base: 15px;
  --text-sm: .875rem;
  --text-md: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.75rem;
  --target: 44px;

  --card-w: 108px;
  --card-compact-w: 69px;
  --deal-card-w: 54px;
  --declarer-size: 3rem;
  --hand-margin: 22px;
  --hand-arc: clamp(.3px, calc((100dvh - 560px) * .0045), .9px);
  --hand-fan: 2deg;
  --hand-cap: 120px;
  --hand-turn-lift: -3px;
  --score-width: 178px;
  --seat-width: 116px;
  --menu-width: 300px;
  --dialog-width: 36rem;
  --statistics-width: 52rem;
  --stat-min: 9.5rem;
  --panel-width: 560px;
  --setup-space: 8dvh;

  --transparent: transparent;
  --list-divider: rgb(165 138 78 / 40%);
  --turn-halo: rgb(220 184 100 / 45%);
  --turn-halo-pulse: rgb(220 184 100 / 25%);
  --trump-seal-ink: var(--trump-ink);
  --shadow-card: -3px 3px 4px rgb(0 0 0 / 30%);
  --shadow-turn: 0 0 0 2px var(--plate), 0 0 0 4px var(--turn), 0 0 18px 6px var(--turn-halo);
  --shadow-turn-pulse: 0 0 0 2px var(--plate), 0 0 0 4px var(--turn), 0 0 28px 10px var(--turn-halo-pulse);
  --shadow-trump: inset 0 0 0 3px var(--trump-edge), inset 0 5px 0 var(--trump-edge);
  --shadow-winner: 0 0 0 3px var(--win-glow), 0 0 22px 6px var(--win-glow);
  --line: 1px;
  --line-strong: 2px;
  --focus-width: 3px;
  --focus-offset: 2px;
  --focus-inset: -2px;
  --focus-halo-size: 6px;
  --radius-card: 8% / 5.65%;
  --radius-round: 50%;
  --wordmark-tracking: -.01em;
  --notice-icon-size: 1.6em;
  --card-seal-scale: .14;
  --card-selected-lift: -12px;
  --hand-height-limit: 20dvh;
  --turn-halo-time: 2.4s;

  --content-width: 72rem;
  --choices-width: 30rem;
  --meld-card-w: clamp(36px, 4.5cqw, 60px);
  --trick-card-w: clamp(48px, min(7cqw, 8cqh), 84px);
  --review-card-w: 48px;
  --trick-tilt-max: 12deg;
  --hidden-size: 1px;
  --rail-inset: 11px;
  --table-gutter: 32px;
  --hand-seat-clearance: 286px;
  --table-column-gap: 66px;

  --compact-history-height: 60dvh;
  --lobby-middle: 40rem;

  --stepper-input: 6rem;

:root[data-trump="blue"] { --trump-tint: #cfe1f7; --trump-edge: #1d5ca6; --trump-ink: #0e355f; --trump-seal-ink: #fff; }
:root[data-trump="purple"] { --trump-tint: #e6d8f6; --trump-edge: #6b35a8; --trump-ink: #3a1a62; --trump-seal-ink: #fff; }

/* Base: the felt, type and native controls. */
html { font-size: var(--text-base); }
body {
  margin: 0; min-height: 100dvh; color: var(--text); font-family: var(--font); font-size: var(--text-md);
  background: radial-gradient(ellipse at center, var(--felt-centre), var(--felt-edge)) fixed var(--felt-edge);
}
a { color: var(--focus); }
:focus-visible { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); box-shadow: 0 0 0 var(--focus-halo-size) var(--focus-halo); }
button, input, select { font: inherit; min-width: var(--target); min-height: var(--target); margin: var(--space-1); }
button {
  padding: var(--space-2) var(--space-4); border: 0; border-radius: var(--radius-pill); cursor: pointer;
  background: var(--secondary); color: var(--secondary-ink); box-shadow: 0 var(--lip) 0 var(--secondary-lip);
}
button:active:not(:disabled) { translate: 0 var(--lip); box-shadow: none; }
button:disabled { cursor: default; opacity: .5; }
input, select {
  box-sizing: border-box; padding: var(--space-2) var(--space-3); border: var(--line) solid var(--brass-bright);
  border-radius: var(--radius-input); background: var(--input); color: var(--text);
}
input[type="checkbox"], input[type="radio"] { width: var(--target); height: var(--target); vertical-align: middle; accent-color: var(--primary); }
label { display: inline-block; margin: var(--space-2); }
summary { min-height: var(--target); cursor: pointer; padding: var(--space-2); }

/* Shell: the full-screen felt with its rail, the wordmark and a slot for Menu. */
.shell {
  box-sizing: border-box; min-height: 100dvh; display: flex; flex-direction: column;
  border: var(--rail-width) solid var(--rail); box-shadow: inset 0 0 0 var(--line) var(--brass);
}
.shell-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-2) var(--space-4); }
.shell-body { flex: 1; padding: 0 var(--space-6) var(--space-6); }

.lobby-table { height: calc(100dvh - var(--menu-clearance)); min-height: 0; grid-template-columns: var(--lobby-seat) minmax(0, 1fr) var(--lobby-seat); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: ". north ." "west middle east" ". south ."; }
.lobby-table .position-0 { grid-area: south; }
.lobby-table .table-middle { justify-self: center; width: 100%; max-width: var(--lobby-middle); box-sizing: border-box; justify-content: start; }
.lobby-table .panel + .panel { margin-top: var(--space-4); }
.lobby-table input[readonly] { width: 100%; margin-inline: 0; }
.seat-choice { padding: 0; margin: 0; width: 100%; border-radius: var(--radius-plate); background: var(--plate); color: var(--text); box-shadow: none; white-space: normal; }
.seat-choice:disabled { opacity: 1; }
.seat-choice[aria-pressed=true] { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); }
.own-seat .nameplate, .seat-choice.own-seat .nameplate { box-shadow: inset 0 0 0 var(--line-strong) var(--brass-bright); }
.stepper { display: flex; align-items: center; flex-wrap: wrap; }
.stepper input { width: var(--stepper-input); min-width: 0; }
@media (max-width: 40em), (max-height: 35em) {
  .lobby-table { height: auto; overflow: visible; padding: var(--space-3) 0; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, auto); grid-template-areas: "south north" "west east" "middle middle"; }
  .lobby-table .table-seat { justify-self: stretch; align-items: stretch; }
  .lobby-table .table-middle { overflow: visible; padding: var(--space-2) 0; }
  .lobby-table .panel { padding: var(--space-3); }
}

.stepper-field { border: 0; padding: 0; min-width: 0; }
.stepper-field legend { padding: 0; font-weight: 700; }
/* Deal packets share a table-sized path; each packet is one engraved back. */
.deal-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
.deal-caption { position: absolute; top: 40%; width: 100%; text-align: center; font-size: var(--text-lg); font-weight: 700; }
.deal-path { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.deal-path.from-0 { --from-x: 50%; --from-y: 87%; }
.deal-path.from-1 { --from-x: 8%; --from-y: 46%; }
.deal-path.from-2 { --from-x: 50%; --from-y: 12%; }
.deal-path.from-3 { --from-x: 92%; --from-y: 46%; }
.deal-packet.to-0 { --to-x: 50%; --to-y: 87%; }
.deal-packet.to-1 { --to-x: 8%; --to-y: 46%; }
.deal-packet.to-2 { --to-x: 50%; --to-y: 12%; }
.deal-packet.to-3 { --to-x: 92%; --to-y: 46%; }
.deal-packet { position: absolute; translate: -50% -50%; left: var(--to-x); top: var(--to-y); opacity: 0;
  animation-duration: var(--packet-flight); animation-delay: calc(var(--shuffle-duration) + var(--packet-index) * var(--packet-interval)); animation-timing-function: ease-in-out; }
.deal-packet .card { --card-w: var(--deal-card-w); }
.packet-flight { animation-name: packet-flight; }
.packet-fade { animation-name: packet-fade; }
@keyframes packet-flight {
  0% { left: var(--from-x); top: var(--from-y); opacity: 0; }
  15%, 85% { opacity: 1; }
  100% { left: var(--to-x); top: var(--to-y); opacity: 0; }
}
@keyframes packet-fade { 0%, 100% { opacity: 0; } 15%, 85% { opacity: 1; } }
.auction { text-align: center; background: var(--transparent); border: 0; padding: var(--space-2); }
#bid-grid { margin: var(--space-1) auto; gap: var(--space-1); }
#bid-grid .btn { margin: 0; }
.trump-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); max-width: var(--choices-width); margin-inline: auto; }
.trump-choices h3 { grid-column: 1 / -1; margin-block: var(--space-1); }
.trump-choices .btn { margin: 0; white-space: normal; }
.table-seat .nameplate:has(.declarer-cue) { grid-template-columns: minmax(0, 1fr) auto; }
.table-seat .nameplate:has(.declarer-cue) > :not(.declarer-cue) { grid-column: 1; }
.table-seat .nameplate > .declarer-cue { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
.table-middle:has(.table-stage:not([hidden]) .trick-cross):not(:has(#meld-panel)) { overflow: visible; }
/* Scorecard and game result keep history inside the middle of the felt. */
.score-sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.score-panel { min-width: 0; padding: var(--space-3); font-size: var(--text-sm); box-shadow: none; }
.score-panel h3 { margin: 0 0 var(--space-2); color: var(--primary); font-size: var(--text-base); }
.score-panel p { margin-block: var(--space-1); }
.score-panel small { display: block; color: var(--text-muted); }
.contract-stamp { display: inline-block; border: var(--line) solid var(--brass-bright); border-radius: var(--radius-input); padding: var(--space-1) var(--space-3); color: var(--primary); font-weight: 800; }
.deal-scorecard { text-align: center; }
.deal-scorecard .score-panel { text-align: start; }
.result-panel { max-height: calc(100dvh - var(--result-clearance)); min-height: 0; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); }
.result-panel > h2, .result-panel > p { margin: 0; }
.result-panel > .score-sides, .result-panel > .btn { flex-shrink: 0; }
.result-history { min-height: 0; overflow: auto; overscroll-behavior: contain; padding: var(--space-1); scrollbar-width: thin; }
.result-history .panel { padding: var(--space-3); box-shadow: none; }
.result-history h3 { margin-block: var(--space-1); }
.result-history summary { min-height: var(--target); display: flex; align-items: center; cursor: pointer; }
@container table-frame (width < 40em) or (height < 35em) {
  .result-panel { max-height: none; }
  .result-history { max-height: var(--compact-history-height); }
}
@media (max-width: 30em) {
  .score-sides { grid-template-columns: minmax(0, 1fr); }
}

/* On-the-felt Menu panels use the single native dialog host. */
.menu-dialog.wide { width: min(var(--statistics-width), calc(100vw - 2 * var(--space-4))); }
.menu-dialog > .panel-actions { justify-content: space-between; align-items: center; margin-bottom: var(--space-3); }
.menu-dialog h2 { margin: 0; }
.menu-dialog .choice label { display: inline-block; }
.menu-dialog .choice input { width: 100%; height: 100%; }
.menu-dialog .field input[type=range] { width: 100%; margin-inline: 0; accent-color: var(--primary); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--stat-min)), 1fr)); gap: var(--space-2); }
.table-scroll { max-width: 100%; min-width: 0; }
.table-scroll table { width: 100%; border-collapse: collapse; white-space: nowrap; }
.table-scroll caption { text-align: left; color: var(--panel-detail); }
.table-scroll th, .table-scroll td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: var(--line) solid var(--brass); }
